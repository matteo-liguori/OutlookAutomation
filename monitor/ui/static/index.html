<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Current threads · Outlook Automation</title>
  <link rel="stylesheet" href="/static/viewer.css">
  <script src="/static/viewer.js" defer></script>
</head>
<body>
  <header class="masthead"><div class="brand"><span class="mark" aria-hidden="true">O</span><div>Outlook Automation<span class="eyebrow">YOUR CURRENT WORK</span></div></div><span class="readonly">Local workspace</span></header>
  <main>
    <div class="heading"><div><h1>Open threads</h1><p class="subtitle">Current conversations, next steps and the dates that matter.</p></div><button id="refresh" class="quiet">Refresh</button></div>
    <div class="toolbar">
      <div class="view-switch" role="group" aria-label="View"><button id="grid-mode" aria-pressed="true">Card grid</button><button id="timeline-mode" aria-pressed="false">Action timeline</button></div>
      <label class="search"><span class="sr-only">Search current cards and actions</span><input id="search" type="search" placeholder="Find a thread or action…" autocomplete="off"></label>
      <label class="filter"><span class="sr-only">Filter work</span><select id="filter"><option value="all">All open work</option><option value="needs-user">Needs me</option><option value="waiting">Waiting</option><option value="due">Due for attention</option><option value="snoozed">Snoozed</option></select></label>
    </div>
    <div class="view-meta"><p id="count">Loading current records…</p><p id="freshness" role="status"></p></div>
    <p id="error" class="error" role="alert" hidden></p>
    <section id="content" aria-label="Current work"></section>
    <footer>Opening or editing labels does not mark a card reviewed. Notes stay pending until handled. <span>Dates shown in Europe/London.</span></footer>
  </main>
  <dialog id="detail" aria-labelledby="detail-title">
    <header class="detail-header"><div><p id="detail-id" class="eyebrow"></p><h2 id="detail-title">Thread details</h2></div><button id="close-detail" class="quiet" aria-label="Close thread details">Close ×</button></header>
    <div id="detail-body"></div>
  </dialog>
</body>
</html>
