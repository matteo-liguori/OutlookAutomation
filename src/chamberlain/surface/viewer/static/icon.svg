<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>Chamberlain</title>
  <rect width="64" height="64" rx="14" fill="#243e35"/>
  <!-- The scroll: a parchment sheet between two rolled ends. -->
  <rect x="15" y="16" width="26" height="33" fill="#f3efe2"/>
  <rect x="11" y="11" width="34" height="9" rx="4.5" fill="#e2dcc8"/>
  <rect x="11" y="45" width="34" height="9" rx="4.5" fill="#e2dcc8"/>
  <circle cx="15.5" cy="15.5" r="2" fill="#243e35" opacity="0.35"/>
  <circle cx="15.5" cy="49.5" r="2" fill="#243e35" opacity="0.35"/>
  <!-- Lines of writing. -->
  <g fill="#243e35" opacity="0.55">
    <rect x="19" y="25" width="15" height="2.5" rx="1.25"/>
    <rect x="19" y="31" width="18" height="2.5" rx="1.25"/>
    <rect x="19" y="37" width="11" height="2.5" rx="1.25"/>
  </g>
  <!-- The quill: a gold feather, its nib resting on the sheet. -->
  <path d="M57 5 C43 7 33 21 31.5 38 C39 33 53 23 57 5 Z" fill="#d9b45a"/>
  <path d="M31.5 38 L53 10" stroke="#8a6a24" stroke-width="1.6" stroke-linecap="round" fill="none"/>
  <path d="M31.5 38 L27.5 44" stroke="#d9b45a" stroke-width="2.6" stroke-linecap="round" fill="none"/>
</svg>
