# The standard layout of a pass report. The owner's own layout, if there is one, lives in the
# data root at config/report-template.yaml and replaces this file as a whole.
#
# by: harness  - the harness writes the section from its own records, when the pass ends.
# by: agent    - the assistant writes it; `instructions` is what it is told.
# A section with nothing to say is left out.
version: 1
title: "Mail check {date}"
slots:
  - id: access_problems
    by: harness
    heading: "ACCESS PROBLEM - YOUR CHECK NEEDED"
    style: red
    mark: "\U0001F7E5"
  - id: important_appointments
    by: harness
    heading: "IMPORTANT APPOINTMENT - ACKNOWLEDGEMENT REQUIRED"
    style: orange
    mark: "\U0001F7E7"
  - id: email_and_tasks
    by: agent
    heading: "Email and tasks"
    instructions: >-
      Include meaningful changes, every unsnoozed action that waits on the owner, and due
      reminders. For each item write a bold title and status, then the next step: who needs to do
      what, and by when. Add earlier context, new developments or elapsed waiting times only when
      they help the owner act. Keep unchanged reminders brief and call them reminders. Propose
      reply text when it helps. Leave out finished or dismissed items unless something new
      reopens them. Mention calendar items only when the owner must act or acknowledge, or when a
      change or a gap in coverage matters.
  - id: permission_reviews
    by: harness
    heading: "Permission reviews"
  - id: verification
    by: harness
    heading: "Verification"
