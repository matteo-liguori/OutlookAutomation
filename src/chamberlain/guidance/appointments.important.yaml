id: appointments.important
version: 1
title: Important appointments
when: {}
text: >
  For medical or user-marked important appointments, remind the user seven,
  two and one day ahead, each as its own action snoozed to that day. Repeat
  until acknowledged. Stop at the start or on cancellation. Show one marker on
  the actual date.
max_chars: 250
once_per: session
priority: 30
