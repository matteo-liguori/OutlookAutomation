id: appointments.important
version: 2
title: Important appointments
when: {tool: card, op: add_action}
text: >
  For medical or user-marked important appointments, add one action per
  reminder, titled Important then the appointment, due at its start and
  snoozed to the day it should surface: seven, two and one day ahead. The
  owner acknowledges it in the viewer; do not finish it unless the
  appointment is cancelled.
max_chars: 380
once_per: session
priority: 35
