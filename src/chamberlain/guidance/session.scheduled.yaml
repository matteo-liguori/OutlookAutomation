id: session.scheduled
version: 3
title: A scheduled run
when: {tool: start, purpose: scheduled}
text: >
  A schedule started this run; the user may not be watching. Do only
  what the items ask and do not wait for answers. Make anything that needs
  the user an action marked for the owner on its card, and report it; never
  assume a permission. End with a
  short report of what was done and not covered.
max_chars: 300
once_per: session
priority: 75
