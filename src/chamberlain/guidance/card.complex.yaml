id: card.complex
version: 1
title: A card that needs more room
when: {error: card.over_cap}
text: >
  A card hit its size limit. Shorten it first. If the matter is genuinely
  demanding, you may ask the owner for a larger card with a short reason; the
  owner decides, and only three can exist.
max_chars: 230
once_per: session
priority: 48
