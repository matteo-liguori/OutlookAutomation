id: mail.unmatched
version: 3
title: New mail to triage
when: {event: mail.new_unmatched, reason: received}
text: >
  List the new mail and open only what you need. Suggested cards are
  guesses; you decide each link. A deadline, promise or expected reply needs
  a card; routine mail can be left.
max_chars: 180
once_per: session
priority: 40
