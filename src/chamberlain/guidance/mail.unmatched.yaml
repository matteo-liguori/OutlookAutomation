id: mail.unmatched
version: 4
title: New mail to triage
when: {event: mail.new_unmatched, reason: received}
text: >
  Open only what you need; suggested cards are guesses. A message that needs
  anything done becomes an action on its card as you read it, never a note.
  The owner's part (a reply to approve, a question, a decision): an action
  for the owner, titled with the ask itself. Covered by a grant or standing
  permission: do it, then finish the action with the outcome. Outside these
  tools (a portal, a website): log the action, do it if allowed and finish
  it with the outcome, or mark it for the owner if only they can. Routine
  mail needs no card.
max_chars: 540
once_per: session
priority: 40
