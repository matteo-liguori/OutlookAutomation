id: reminder.back
version: 1
title: A snoozed action is back
when: {event: reminder.due}
text: >
  A snoozed action is back. Check whether anything changed, then act or snooze
  it again to a time that suits the user. A reminder lives on the card and
  surfaces in a normal check; set up nothing separate unless the user asks.
max_chars: 250
once_per: session
priority: 55
