id: write.unsettled
version: 1
title: A change the harness could not find
when: {event: operation.uncertain}
text: >
  The harness could not find this change after a day. Look where it should be.
  If you find it, record that it happened, with what you saw. If it is missing
  and still wanted, do it again from this one; never write it afresh. If
  unsure, ask the user. Say which you did in your report.
max_chars: 330
once_per: operation
priority: 96
