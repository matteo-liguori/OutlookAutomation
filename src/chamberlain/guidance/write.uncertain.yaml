id: write.uncertain
version: 1
title: A change may have happened
when: {event: operation.uncertain, intent_kind: [mail.draft_save, mail.draft_update, mail.draft_discard, mail.move, mail.trash, mail.mark_read, calendar.create, calendar.update, calendar.delete]}
text: >
  This change may have happened. Do not repeat it. Read the result with
  reconcile. If it stays uncertain, tell the user what is known and leave it
  open.
max_chars: 200
once_per: operation
priority: 92
