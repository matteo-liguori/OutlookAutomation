id: send.uncertain
version: 2
title: A send may have gone out
when: {event: operation.uncertain, intent_kind: mail.send}
text: >
  This send may have gone out. For now do not send it again, in any form. Read
  what happened with reconcile. The harness looks once more after a day and
  tells you if it is missing. Until then tell the user plainly what is known.
max_chars: 260
once_per: operation
priority: 95
