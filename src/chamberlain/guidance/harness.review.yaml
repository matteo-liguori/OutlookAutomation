id: harness.review
version: 2
title: Reviewing how you work
when: {event: harness.review}
text: >
  Do this last. The list is what you ran outside these tools. Which repeated
  workarounds should a harness feature replace? Does anything worry you? Keep
  each as a finding: idea or worrying, a bar, one sentence. Then mark it
  handled. Leave it out of every report.
max_chars: 320
once_per: event
priority: 30
