# Shared behaviour defaults. Private customisations override these values.
schema_version: 1
timezone: Europe/London
schedule:
  morning: 09:00
  continuations:
    - 14:00
    - 19:00
  title: Mail check {date:%d/%m/%Y}
  roundup_weekday: 6
  roundup_start: 08:30
  roundup_end: 10:00
reviews:
  card_days: 7
  followup_days: 7
  hour: 9
  urgent_max_days: 3
  upgrades_days: 5
  upgrades_after_hour: 14
maintenance:
  closed_thread_days: 365
  daily_backups: 2
  weekly_backups: 2
  special_backups: 1
  cache_days: 1
  temporary_days: 7
  development_days: 30
  collector_cache_hours: 24
  small_attachment_bytes: 10485760
permission_defaults:
  local_records: true
  managed_maintenance: true
  routine_filing: true
  filing_changes_read_state: false
  filing_deletes_mail: false
  filing_reports_spam: false
  filing_unsubscribes: false
  sending: conversation-or-stored-permission
  calendar_writes: specific-or-stored-permission
  appointment_permission_covers_email_commitments: true
  appointment_permission_covers_invitations_rsvps_cancellations_deadlines: false
  new_sending_route_requires_approval: true
  unchanged_approved_batch_survives_recovery: true
instructions:
  reporting: |-
    # Reporting

    Use the supplied report template. Personal style belongs in private instructions.reporting; required coverage and actual authority still apply.
  card-input: |-
    `case edit --input -`: id, expected_revision, idempotency_key, optional title (180 chars), purpose (600 chars/three lines) and note (2000 chars). Edits preserve action/review clocks. Pending notes appear in briefing and case show until handled. `case note-ack --input -`: id, expected_revision, idempotency_key, note_ids and outcome (600 chars). Handle notes and record resulting changes before acknowledging; leave blocked notes pending. Existing send/calendar permission boundaries still apply.
  ui: |-
    Optional current-work viewer: install packaging/requirements/requirements-ui.lock in the project environment, then run ui. Opens a local card grid and action timeline; click for details, label edits or a note for the next agent pass. Notes stay pending until explicitly handled; help card-input. Browsing and label edits preserve task/review clocks. No Outlook scans. Ctrl+C stops it; --no-browser prints the private local link.
  outlook: |-
    Outlook access: `outlook <operation> --input -` takes JSON. Enabled operations and fields are listed below.
    Use configured source IDs and ISO timestamps with offsets. The harness handles account binding and backend sequencing.
    `collect` prepares/checks the source and returns a bounded page; optional run_id imports all pages into that run.
    `send` and draft operations use approval_id; omitted message fields come from the exact SQLite approval.
    Materialise applicable conversation/standing scope without asking again. Submission is not verified delivery.
    Preserve read state and inspect completeness/errors. Use help permissions/calendar-decisions for authority.
    Where listed, trash uses an exact one-off scope: operation trash-message, mailbox, source_folder_id, entry_id, destination_folder_id (the configured Trash), internet_message_id. It is recoverable. move-reconcile/trash-reconcile take the original approval_id and check outcomes without repeating the mutation.
    Calendar writes use an exact scope: operation calendar-create/calendar-update/calendar-delete, calendar_id, event_id; create/update require icalendar; update/delete require expected_icalendar from a current full calendar-read. Invitation handling depends on adapter capability.
    Installation internals are available only when diagnosing with `outlook status --details`.
  case-organisation: |-
    `case merge/split --input -` requires expected_revisions, idempotency_key, reason and evidence_ids. Merge: target_id and source_ids. Split: source_id, new target_id, action_ids and target title/position. Preserve action IDs, dependencies, clocks and permissions; reconcile context after organisation. This does not complete obligations.
  scheduling: |-
    `schedule plan` supplies future London/UTC instants; create the applicable app schedule and read it back, then use schedule verify. Use its bounded UTC DTSTART/RRULE or individual one_shot_rules; optional triggered_at checks a recorded firing time. Same-date continuations target the current mail chat. Schedule only authorised future work and stop it when no useful work remains.
  accounts: |-
    Account identities, source roles and personal routing come from the private profile. Respect explicit account choices and applicable permissions.
  briefing: |-
    briefing has four sections: open-thread recognition/goals, due actions/alerts, periodic card reviews, commands. Use review next for due reviews; briefing --case <id> or --message-input - for related work, case show <id> for the full card, help <operation> for procedures. Follow paging cursors. Future/snoozed work and full card bodies stay out of the default briefing.
  scheduled-guard: |-
    Core commands compare the dated chat name with today's configured local date. A mismatch produces an advisory warning for any turn, including direct user replies. The command continues normally. `guard` exposes the same advisory check and exits successfully; it does not open the main harness database.

    The warning says: This chat might be stale. Continue if you're interacting live with the user; otherwise check whether this is a stale automation. Use current user instructions and the actual task date to decide; the warning alone does not order cancellation or authorise any external action. Undated or unparseable chat names do not trigger it.

    Emit at most once per chat every 30 minutes across commands/processes/adapters, without timers or model wakes. The private monitor/chat-warning.sqlite cooldown cache retains only hashed chat identifiers and expiry timestamps, pruning expired entries on the next warning. If that cache is unavailable, show an advisory with cooldown_unavailable rather than block work. Local Codex display names, the configured schedule.title format and timezone drive the date comparison; turn attribution adds context when available. Windows namespace access and restart also run this check. No automation is deleted automatically.
  context: |-
    `context put --input -` takes id, entity, text and evidence_ids (plus relevant provenance). Keep one current canonical record for the subject; update it rather than making parallel notes. Retrieve only matching records with context get <term>. Use the structured stdin bridge shown by help records.
  action-review: |-
    `action review --input -` takes action_id, parent expected_revision, idempotency_key, review_kind (records/mail/source-check), outcome, evidence_ids and review_policy. Policy requires urgency immediate/high/normal/low, interval_days1–90 (maximum3 for immediate/high), basis calendar/working, reason and evidence_ids. Describe the actual review scope. A review does not complete work, authorise external action or reset existing follow-up anchors.

    At review, judge ongoing relevance from the date, context and risk of error. Close unless a concrete current reason warrants tracking; technical incompleteness alone does not. Use judgment in clear cases. Ask if genuinely unsure or missing a material fact you cannot reasonably retrieve. Record why; email evidence can be retrieved again.
  evidence: |-
    `evidence put --input -` takes compact body, source, kind, relevant timestamps and provenance/locators; id is optional. Evidence is immutable. Store full email bodies with thread put (case_id, message), not evidence put. Use the structured stdin bridge shown by help records.
  mail-coverage: |-
    Current mailbox access is verified, but an older coverage gap remains. Collect and reconcile the missing interval using run start bounds and the recorded coverage_gap_from/through; preserve the gap until verified recovery. Disclose any unfinished catch-up. This gap alone does not require another delivery test.
  records: |-
    ## Commands and input

    Discover current work with `briefing`; retrieve `case show/search`, `context get`,
    `evidence show`, `thread messages/find`, `health`, `approval list/show` explicitly.
    Retrieve full bodies separately. Match conversation/reference/store identifiers.

    Global `--format json`, `--limit`, `--cursor`, `--db` precede commands. Follow every
    cursor with the same query, reassemble `json_chunk` parts, restart changed queries.
    Pages allow 12,000 characters. Interpreter override: `monitor.ps1 -Python <path>`.

    Structured writes/collector results go directly through stdin:

    ```powershell
    . .\monitor\adapters\windows\OutlookHarness.Common.ps1
    Invoke-OutlookHarness -Arguments @('evidence','put','--input','-') -InputObject $payload
    ```

    Use this bridge for structured input.
  card-writes: |-
    ## Card writes

    One current card contains context, position, review/report markers and evidence
    index; its displayed actions are canonical harness rows. Apply upkeep on due work,
    related evidence or explicit requests. Recognition entries are not review triggers.
    Follow help retention when retiring work; scope working notes to action_ids.

    Commands below take `--input -`:

    | Command | Payload |
    | --- | --- |
    | `evidence put` | Compact body, source, timestamps, provenance, exact locators; optional id |
    | `thread put` | case_id, message (full email) |
    | `case update` | id, expected_revision, idempotency_key, evidence_ids, case, complete actions; optional replacement decisions |
    | `action review` | action_id, parent expected_revision, idempotency_key, review_kind (records/mail/source-check), outcome, evidence_ids, review_policy |

    Case: title, purpose, context, position, status open/closed; optional aliases/match_keys.
    match_keys is an object with sources/conversation_ids/references lists of nonempty strings.
    Action: id, owner, status needs-user/waiting/watch/done/dismissed, next_step,
    completion_condition, reopening_condition, follow_up; optional deadline, promised_at,
    explicit_review, snooze_until, reviewed_at/review_outcome. Dates use offsets; unknown
    historic dates remain unknown. Non-email tasks use user-instruction evidence.

    Use normal word spacing in all prose. Shorten wording rather than joining words.
    Limits: purpose 600 characters/three lines; context 6,000 ceiling; position 1,200;
    next_step 400; completion/reopening conditions 300. Condense context, not obligations.
    Resolution needs completion_reason/completion_evidence, including user dismissal.
    Reconcile cross-thread dependencies before retiring prerequisites. Saves atomically
    remove validated done/dismissed actions and terminal one-off approvals; preserve
    unresolved siblings/pending wording. Reopening needs evidence/reason and fresh IDs/cache.
    Decisions: id, text, evidence_ids, optional same-thread action_ids; replace spent
    notes (`[]` clears, omission preserves). Scoped notes expire with their final action.

    For action timing use `monitor.ps1 help action-scheduling`.
  permissions: |-
    ## Permissions

    Reusable scope lives in standing_approvals, one-offs in approvals.
    Logging or reading a thread message surfaces thread-bound and global candidate
    standing sending grants with their exact limits. Check the full message and
    attachments against the grant; carry out qualifying authorised sends without
    asking again. Repeated notices require duplicate checks, not repeated sends.
    `approval put`: kind, id, optional case_id, actual granted_at, evidence_ids, exact message/task scope;
    standing adds title/summary/triggers/boundaries. Keep permission scope in these rows.

    Resurface monthly on the original London grant anniversary, clamped for short months;
    unknown dates need review now. Only explicit user confirmation renews review;
    reading/use/silence does not renew or revoke unchanged authority. `approval review`:
    id, expected_revision, decision keep/revoke/spent, reason/evidence_ids. Unknown dates
    get a truthful reconfirmation anchor. `approval flag` uses id, expected_revision,
    reason/evidence_ids and suspended=true for unclear scope. Retire delivered one-offs;
    other permissions end on withdrawal, expiry or proven scope end. Spent standing
    needs scope_ended=true; closure only ends it with
    end_on_case_close. Preserve pending approved wording until reconciled.
  pass-receipts: |-
    ## Pass receipts

    `run start [--activated]` returns ID, mail bounds and per-store filing_windows.
    `run ingest <run>`: source a configured mail source, started_at, ordered
    pages, freshness; identities/window/probe must match. Follow `run candidates` pages.
    `run record` accepts one record or an atomic array:

    | kind | Fields |
    | --- | --- |
    | candidate | id, source, entry_id, evidence_ids, disposition, review_reason; material: body_evidence_id and case_id/case_revision or no_update_reason |
    | source | source a configured calendar source, status, complete, four days, events, evidence_ids, provenance |
    | gate | name refresh/records/title, evidence_ids; refresh: success/completed_at/provenance; records: success; title: value/readback evidence |
    | handoff | delivered, case_ids/case_revisions, action_ids, event_ids/cancellation_ids (`source:id`), roundup_ids, issue_ids, approval_ids, four days |

    For scoped quiet decisions, handoff accepts quiet_cases with case_id, revision,
    reason and evidence_ids. These acknowledge review, not delivery; required work
    cannot be suppressed. Report data exposes quiet_allowed.

    Weekly roundups appear only for Sunday runs starting {{schedule.roundup_start}}-{{schedule.roundup_end}} London (allowing
    early/late 09:00 startup); incomplete or ineligible handoffs preserve the queue.

    Events: stable id/title, offset-qualified start/end, location, all_day.
    Use explicit_cancellations for authoritative cancelled records; preserve active replacements. Mail receipts
    come from ingest. Follow `report data`, check `run status`, then `run finalize`;
    incomplete gates/sources remain partial. Acknowledge only actual delivered verified
    coverage; undelivered work/cancellations remain pending. Finalization records metrics;
    the assistant interprets mail and the harness validates records.
  storage: |-
    ## Automatic storage policy
    Use help thread-cache for correspondence and action ownership, and help retention
    for completion cleanup, expiry, temporary files and backups. These are the
    canonical procedures; standing rules do not belong in individual task notes.
    Recover the profile with `python manage_data.py --restore-profile-from <backup.db>
    --profile-output <new-profile.json>`; existing files are preserved.
    Restore current format to a new path
    with writers closed, doctor/compare before switching; never copy a live WAL alone.

    For code changes run tools/test_harness.ps1 and relevant offline fixtures;
    live sends/calendar writes/restarts are not regression tests.
  mail-access: |-
    Check current profile and source health; follow any applicable delivery-test permission before escalating access uncertainty. Use the authorised account and route. Report remaining gaps promptly; the user handles credentials and sign-in.
  watches: |-
    `watch put --input -`: id, terms (literal words/phrases), text (brief positive cue),
    evidence_ids and enabled (boolean). `watch list` shows the private SQLite objects.
    Mail/calendar reads, receipts, reports and case/briefing data are checked for terms.
    A match injects the cue once per chat and instruction version. The model evaluates
    relevance and arranges any authorised action/reminder, with ordinary verification.
    Set enabled false to stop a watch. Watches retain no encountered content or match logs.
  calendar-decisions: |-
    ## Calendar decisions

    Use the enabled calendars from the private profile. Before offering/accepting/declining
    times, check all enabled sources for travel, adjacent/all-day commitments, transitions and
    aftercare. Respect exclusive all-day ends; disclose conflicts/unavailable sources.
    Establish availability from complete calendar coverage.

    Check consequential commitments/deadlines learned from mail for calendar presence.
    Report the existing event or exact needed entry. Where stored authority covers a
    clear email commitment, verify details/target/duplicates/conflicts, add, read back
    and report. Obtain authority for changes to conflicting events separately.

    Medical/user-marked important appointments need separate seven/two/one-day needs-user
    acknowledgements, snoozed to each milestone. Repeat until acknowledged; generic
    acknowledgement clears the current milestone only. Newly learned appointments get
    meaningful remaining milestones; urgent ones surface immediately. Stop at start,
    cancellation or dismissal.
  activation: |-
    ## Activation

    The first full `briefing` starts setup automatically; try title/follow-up setup now;
    no user reply is required to try. On a user reply first use `briefing --user-active`
    and resolve pending setup before other message content. If an actual startup attempt
    fails, record `activation defer --input -` (reason, evidence_ids), continue the mail
    pass and retry when the user replies; no repeated background attempts.
    Briefing reads local chat-title and automation metadata and clears verified work
    automatically, or names only missing work. Unknown metadata is not proof of absence.
    Runtime activity is not evidence that the user is present.
    Database-backed calls repeat a short reminder until `activation complete --input -`:
    title_readback, evidence_ids, followup {status ACTIVE, target_thread_id, rrule}.
    If no same-day times remain use followup {status none-needed}. Record actual app
    readbacks; the helper verifies the London date, chat target and remaining instants.
    If the user declines follow-ups, record status declined and decline_evidence_ids.

    09:00 Europe/London daily. Read London time, set/read back exactly
    `Mail check DD/MM/YYYY`; plan/create/verify one heartbeat for still-future same-date
    14:00/19:00 only. Read back rules and replan after delays; no next-day substitutes.
    Late activation requires catch-up from the completed watermark even if continuations
    are declined.
  card-upkeep: |
    # Thread review

    At review, judge ongoing relevance from the date, context and risk of error. Close unless a concrete current reason warrants tracking; technical incompleteness alone does not. Use judgment in clear cases. Ask if genuinely unsure or missing a material fact you cannot reasonably retrieve. Record why; email evidence can be retrieved again.

    Read the current card and relevant evidence. Keep purpose recognisable and context
    as the current brief. Reconcile actions, dependencies and spent permissions; retain
    genuine obligations with their IDs, deadlines, promises, snoozes and chase anchors.
    Record retirement accurately without claiming an unverified outcome happened.
    Save one replacement with revision/idempotency guards; use help card-writes for fields.

    `review next` supplies one due card; instructions appear only after over two hours
    without review activity (or on first use). Follow paging cursors.
    Keep: `review complete --input -` takes id, expected_revision, idempotency_key,
    outcome (why tracking remains useful), evidence_ids and optional interval_days (1–90,
    default 7). Close: use case update with resolved/dismissed actions and reasons.
    Then call review next again until complete. Unfinished cards remain due.
    After action-related whole-card work, use review complete or action review to reset
    the periodic clock. Reading alone does not count. Reply clocks and snoozes stay intact.
  filing: |-
    Use filing status for bounded windows and the private profile for approved destination folders. Establish filing preferences before changing mail. Preserve read state; no deletion, spam reports or unsubscribing. Record verified counts, locators and failures with filing record.
  thread-cache: |-
    ## Thread cache

    `thread put --input -` takes case_id, action_ids and message (the full email with metadata/body).
    Anchor cached messages and attachments to the unfinished actions that need them.
    Supply explicit unfinished action_ids for thread attachment, attachment-path
    and persistent outlook read (Windows -ActionIds). Use an in-memory read by
    omitting case_id. Allocate downloads to an owned target.
    `thread bind --input -` takes case_id, exact message_keys/attachment_sha256,
    action_ids, reason and evidence_ids. Use it to reconcile ownership; [] releases
    selected copies. It cannot change server mail. Shared copies survive until their
    final unfinished owner ends; pending send approvals protect required material.

    Relevant mail is in thread_messages; attachments in
    `<data-root>/monitor/threads/<case-id>/attachments/` (safe path from `thread path`).
    Each thread owns its copies, deduplicated by message ID/hash within that thread.
    `Get-OutlookMessage.ps1 -CaseId` reuses/downloads mail and attachments up to 10 MiB;
    -ForceRefresh reads live, -DownloadLargeAttachments fetches needed larger files.
    `thread messages/find` retrieves metadata/bodies; attachment-path/attachment allocates/registers.
    Routine unrelated mail is not persistently cached; portal outcomes need date/reference.
  retention: |-
    Save user data in harness SQLite records or registered action-owned files.
    Obtain explicit user approval for any other destination. Keep inspection in memory.
    Give each retained email/file explicit unfinished action_ids; allocate files
    with thread attachment-path and register them with thread attachment.
    Register existing files inside their owning card directory with thread file.
    Release obsolete unregistered card files with thread discard-file using the
    exact path, SHA256, reason and authority evidence_ids.

    Keep cards limited to current facts and standing rules. Trim completed work in
    the same card replacement. Put temporary notes in decisions with action_ids.
    Completion releases scoped notes and local copies when their final action ends;
    material needed by another unfinished action or pending send stays available.
    Use thread bind to reconcile existing ownership. Keep brief server locators for retrieval.

    Closure deletes bodies/assets, keeping compact outcome/source IDs for 365 days,
    then expires thread-specific records/evidence. Preserve expiry dates on reads and
    start fresh on reopening. Retain useful open caches and unresolved approvals;
    standing preferences remain until changed.

    Health/checkpoints/calendar baselines remain current in place, without access logs
    or expiry. Preserve gaps until verified recovery. Transfer/verify unresolved pass
    work into pending_work before retiring superseded finalized runs. Inactive finalized
    payloads/collector snapshots expire after 24 hours; preserve current receipt/running
    work. Deduplication keeps the seven-day filing window plus active/pending references;
    owned temporary files last seven days.

    Startup/closure/finalization run cleanup and retry visible failures. Maintenance
    status/clean --dry-run/clean/threads expose it; unknown ownership needs reconciliation.
    Keep {{maintenance.daily_backups}} daily, {{maintenance.weekly_backups}} weekly and {{maintenance.special_backups}} version/schema backups. First write per London
    day/ISO week creates its slot; verify replacements before rotation. Keep backups
    within these slots. Backups exclude disposable caches/expired records,
    preserving obligations/approvals/checkpoints. Restore current format to a new path
    with writers closed, doctor/compare before switching; never copy a live WAL alone.

    For code changes run tools/test_harness.ps1 and relevant offline fixtures;
    live sends/calendar writes/restarts are not regression tests.
  configuration: |-
    # Configuration

    User behaviour is in customisations.yaml in the private data root. config show --explain shows effective values and origins; --case ID includes card context. config set --input - takes key/value to update a managed setting. config validate checks it. config review lists pending changes; --input - takes id and decision keep/default. config reset --key path restores a shared default. config migrate previews the older profile migration; --apply backs up and applies it.
  extensions: |-
    # Private extensions

    Private data-root extensions/ID/manifest.yaml declares actions, hooks, settings and optional card overlays. extension list shows hashes/status; extension approve --input - needs id, hash and user-authority evidence_ids. Approve each code version; extension disable ID stops it. Removing/expiry stops overlays on the next invocation. Bundles are trusted local code, not a sandbox. Keep actual permissions in SQLite.
  custom-actions: |-
    # Custom actions

    Cards reference private bundle/action/parameters in custom_action. action run ID --input - needs idempotency_key and an applicable card-bound approval_id whose scope names operation custom-action, bundle and action. Code must be version-approved. Interrupted executions require reconciliation; never blindly replay. Returned Outlook requests still need ordinary approvals.
  updates: |-
    # Tagged updates

    update check [--force] checks maintainer tags on main; update status reads cached results. A normal briefing checks at most daily without another model turn. Offer updates without pulling automatically. Preserve local changes, inspect the tag and migration preview, update the environment and run tests before continuing.
  mail-pass: |-
    # Mail and calendar pass

    Start a run and follow its collection windows. Use outlook collect for each enabled mailbox, follow all pages, inspect freshness and read new candidates fully. Retrieve matching cards; reconcile actions, permissions and replies. File only within approved preferences, preserving read state. Read every enabled calendar for today plus three configured-local days, using outlook calendar or the configured Google/iCloud integration. Follow report data and the reporting template, record actual receipts/handoff, inspect run status and finalize. Disclose incomplete coverage; do not advance unverified checkpoints. Retrieve help for each relevant operation.
  upgrades: |-
    After this mail round, briefly review improvement list against concrete issues noticed during use. Add useful suggestions with improvement add --input -; reuse existing entries. Keep the backlog here and implement on development requests. Finish with improvement checkpoint --input - (summary) to defer this prompt {{reviews.upgrades_days}} days.
  mail-helpers: |
    # Mail helpers

    Keep instructions brief and positive; state the desired behaviour, give each rule
    one home and link to it elsewhere.

    Use `monitor.ps1 outlook <operation>` (Mac: `python -m monitor outlook`).
    Windows helper names below are relative to `monitor/adapters/windows/`.
    `outlook status` lists capabilities/fields; `help outlook` gives the workflow.
    For Mac Thunderbird, use the command correspondence in monitor/adapters/thunderbird/README.md.
    The helpers below are Windows backend/compatibility references. Scope: AGENTS.md.

    | Need | Helper |
    | --- | --- |
    | Accounts/stores | Inspect-Outlook.ps1 -Action Accounts/Stores |
    | Folders/recent/search | Read-OutlookMail.ps1, explicit Store/Folder/Limit/MaxScan |
    | Full tracked mail | Get-OutlookMessage.ps1 -EntryId -StoreId -CaseId -Output Json |
    | Body/recipient search | Search-OutlookMailDetails.ps1 |
    | Contacts | Search-OutlookContacts.ps1 |
    | Bounded collection | Collect-OutlookMonitor.ps1; follow SnapshotId/NextOffset |

    For approved sends, verify the sender account and reuse a successful refresh
    within 15 minutes, otherwise refresh once. Preflight exact recipients, subject
    and distinctive body with Test-OutlookSendDuplicate.ps1 across Sent/Outbox/Drafts.
    Reconcile matches and incomplete scans before submission. Submit approved items
    back-to-back through Send-OutlookStoreMailSafe.ps1 -BatchSubmitOnly with explicit
    Store/To/Cc/Bcc/Body/Attachments. Refresh once, then independently verify unique
    Sent copies, recipients, subject, normalised body and attachment count. Record
    each item's sent, skipped, unsent or uncertain result in the harness.

    Outbox disappearance alone leaves delivery uncertain. Keep sender, recipients,
    body and attachments fixed during recovery and reconcile transport before retrying.
    Meeting invitations need their calendar item and meeting-message classes checked
    as well as ordinary mail. Verify calendar writes through independent readback.

    For COM faults, Test-OutlookSession.ps1 -CheckCom identifies the session. A concrete
    COM failure can use Restart-ClassicOutlook.ps1 in the current logged-in user session;
    retry once after verified restart. Continue independent sources and report gaps.
    Credential and account setup stays with the user. Recovery helpers inspect exact
    items and retain their transport guards; obtain material scope changes explicitly.
templates:
  report: |
    # Mail check DD/MM/YYYY

    Keep instructions brief and positive; state the desired behaviour, give each rule
    one home and link to it elsewhere.

    Use London date and paged report data. Order below; omit empty optional sections.

    **🟥 ACCESS PROBLEM — YOUR CHECK NEEDED**

    Source; problem/uncertainty; last verified/newest time; coverage gap; attempts;
    exact user check. Repeat until verified recovery.

    **🟧 IMPORTANT APPOINTMENT — ACKNOWLEDGEMENT REQUIRED**

    Title; London date/start/arrival; place/link; preparation; countdown/milestone;
    request acknowledgement. Keep explicit labels alongside red/orange styling.

    ## Email and tasks

    Include meaningful changes, all unsnoozed needs-user actions and due reminders.
    Report unchanged waiting/watch work when its scoped rules require attention.
    Treat substantive changes as developments.

    **Thread — status**

    Give a short status and next action: who needs to do what and when. Add previous
    context, new developments, elapsed chase windows or calendar detail when needed to
    understand or act. Keep unchanged required reminders brief.

    Propose supported reply text when useful.
    Include the Sunday 09:00 sign-in roundup when due.
    Label reminders for work already in hand as reminders; say explicitly when no new
    decision is needed. Omit dismissed/completed items unless a new material development
    reopens them; acknowledge a dismissal in its immediate conversation only.

    ## Permission reviews

    Identify due scopes; ask keep/change/revoke. Include IDs in handoff approval_ids.

    ## Calendar — today plus three London days

    List cancellations/removals separately, then every current event and explicit
    empty-day rows, unchanged events included.

    | Date | Local time | Event | Calendar | Location/link | Change |
    | --- | --- | --- | --- | --- | --- |

    Use start/end or All day. New/Updated/Rescheduled/Unchanged; Unchanged requires a
    verified earlier baseline. Merge clear duplicates naming sources; flag uncertain
    matches/conflicts/travel/tentative details. Incomplete empty rows say “No events in
    checked sources”.

    ## Verification

    Refresh result; per-store count/newest/coverage; verified filing counts/checkpoints/
    gaps; each calendar's success/freshness. Disclose unfinished work and label incomplete
    coverage **Partially verified**.
  morning: You are an email, calendar and organisation assistant. Follow AGENTS.md and start with the harness briefing.
  followup: Continue the mail and calendar pass for {date} in this chat. Stop if that date has passed in {timezone}. Follow AGENTS.md and start with the harness briefing.
updates:
  enabled: true
  interval_hours: 24
  remote: origin
  tag_prefix: harness-update/v
